[package]
name = "pricer_pricing"
description = "Monte Carlo pricing engine with Enzyme automatic differentiation for XVA pricing (Layer 3)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
pricer_core = { path = "../pricer_core" }
pricer_models = { path = "../pricer_models" }
infra_domain = { path = "../infra_domain" }
infra_config = { path = "../infra_config" }
bon.workspace = true
strum.workspace = true

# Enum dispatch for static trait forwarding
enum_dispatch.workspace = true

# Basic numeric traits
num-traits.workspace = true

# Linear algebra (Cholesky in LSMC regression)
nalgebra.workspace = true

# Date/time
chrono.workspace = true

# Error handling
thiserror.workspace = true

# Parallel processing
rayon.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Aligned memory allocation (for SIMD optimisation)
aligned-vec = "0.5"

# Graph data structures and algorithms (for computation graph visualisation)
petgraph.workspace = true

[dev-dependencies]
approx.workspace = true
proptest.workspace = true
criterion = { workspace = true, features = ["html_reports"] }
# Iai-callgrind for instruction-count based benchmarks (CI reproducibility)
# Requires Valgrind on Linux - used only in CI environment
iai-callgrind = "0.14"
# JSON serialization for tests
serde_json.workspace = true
# Direct access to PricerRng in benchmarks
pricer_core = { path = "../pricer_core" }

[[bench]]
name = "engine"
harness = false

[[bench]]
name = "engine_iai"
harness = false

[[bench]]
name = "kernel_batch"
harness = false

[build-dependencies]
# Future: For linking Enzyme LLVM plugin
# cc = "1.0"

[features]
default = []
# Enzyme automatic differentiation (future: LLVM plugin integration)
enzyme-ad = []

[lints]
workspace = true
