[package]
name = "pricer_pricing"
description = "Monte Carlo pricing engine with Enzyme automatic differentiation for XVA pricing (Layer 3)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# pricer_core for rng module (always enabled) and optional L1/L2 integration
pricer_core = { path = "../pricer_core", default-features = false, features = ["rng"] }
pricer_models = { path = "../pricer_models", optional = true, features = ["rates"] }
# Infra layer for shared types (Currency, Date, Direction) when l1l2-integration is enabled
infra_master = { path = "../infra_master", optional = true, features = ["serde"] }
# Infra configuration for config-driven pricing (always enabled for BumpSizes)
infra_config = { path = "../infra_config" }

# Basic numeric traits
num-traits.workspace = true

# Date/time (only for l1l2-integration feature)
chrono = { workspace = true, optional = true }

# Error handling
thiserror.workspace = true

# Parallel processing (Phase 4: Thread-local workspace)
rayon.workspace = true

# Serialization (optional)
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# Aligned memory allocation (optional, for SIMD optimisation)
aligned-vec = { version = "0.5", optional = true }

[dev-dependencies]
approx.workspace = true
proptest.workspace = true
criterion = { workspace = true, features = ["html_reports"] }
# Iai-callgrind for instruction-count based benchmarks (CI reproducibility)
# Requires Valgrind on Linux - used only in CI environment
iai-callgrind = "0.14"
# JSON serialization for tests
serde_json.workspace = true

[[bench]]
name = "engine"
harness = false

[[bench]]
name = "engine_iai"
harness = false

[[bench]]
name = "kernel_batch"
harness = false
required-features = ["l1l2-integration"]

[build-dependencies]
# Future: For linking Enzyme LLVM plugin
# cc = "1.0"

[features]
default = []
# Phase 4: L1/L2 integration for smoothing functions, YieldCurve, Instrument
l1l2-integration = ["pricer_core/serde", "pricer_core/equity", "dep:pricer_models", "dep:infra_master", "dep:chrono"]
# Serialization support for GreeksResult
serde = ["dep:serde", "dep:serde_json"]
# Enzyme automatic differentiation (future: LLVM plugin integration)
enzyme-ad = []
# SIMD-aligned memory buffers for AVX-512 optimisation
simd-aligned = ["dep:aligned-vec"]
# VolCube support (requires volcube feature in pricer_models)
volcube = ["l1l2-integration", "pricer_models/volcube"]

[lints]
workspace = true
