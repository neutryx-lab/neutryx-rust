[package]
name = "adapter_loader"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Flat file loaders (CSV/Parquet) and CSA details for Neutryx"

[dependencies]
# Master data from Infra layer
infra_domain = { path = "../infra_domain", features = ["serde"] }

# Pricer layer for target types (MarketInstrument)
pricer_models = { path = "../pricer_models", optional = true }

# CSV parsing
csv = "1.3"

# JSON parsing
serde_json.workspace = true

# Glob pattern matching
glob = "0.3"

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Serialisation
serde = { workspace = true }

# Date/time handling
chrono.workspace = true

# Parquet support (optional)
parquet = { version = "54", optional = true }
arrow = { version = "54", optional = true }

[features]
default = []
full-serde = ["infra_domain/serde"]
parquet = ["dep:parquet", "dep:arrow"]
curve-builder = ["dep:pricer_models"]

[dev-dependencies]
approx.workspace = true
tempfile = "3"

[lints]
workspace = true
