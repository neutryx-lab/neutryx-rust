[package]
name = "infra_config"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "System configuration and environment management for Neutryx"

[dependencies]
# Configuration management
config = { version = "0.14", default-features = false, features = ["toml", "yaml", "json"] }

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Serialisation
serde = { workspace = true }
serde_json.workspace = true
toml.workspace = true

# Date/time
chrono.workspace = true

# System utilities
num_cpus.workspace = true

# Enum utilities
strum.workspace = true

# Store dependencies (optional)
tokio = { workspace = true, optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"], optional = true }
async-trait = { version = "0.1", optional = true }

[features]
default = []
# Serde is always enabled, but this feature exists for compatibility with
# dependents that request it explicitly
serde = []
# Storage backends
postgres = ["dep:sqlx", "dep:tokio", "dep:async-trait"]
redis = ["dep:tokio", "dep:async-trait"]

[dev-dependencies]
approx.workspace = true

[lints]
workspace = true
