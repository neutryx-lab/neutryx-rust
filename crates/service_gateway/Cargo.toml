[package]
name = "service_gateway"
description = "gRPC/REST API Server for Neutryx XVA Pricing Library"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "service_gateway"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "neutryx-server"
path = "src/main.rs"

[[bin]]
name = "neutryx"
path = "src/cli_main.rs"
required-features = ["cli"]

[dependencies]
# Workspace dependencies
thiserror.workspace = true
anyhow.workspace = true
serde.workspace = true

# Async runtime
tokio = { workspace = true }

# gRPC (Tonic)
tonic = "0.12"
prost = "0.13"

# REST (Axum)
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["fs"] }

# WebSocket
futures-util = { version = "0.3", features = ["sink"] }

# Serialisation
serde_json = "1.0"

# Async trait (for custom Axum extractors)
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Internal dependencies (following A-I-P-S: S depends on P, I, A)
pricer_core = { path = "../pricer_core" }
pricer_models = { path = "../pricer_models" }
pricer_pricing = { path = "../pricer_pricing" }
pricer_risk = { path = "../pricer_risk" }
adapter_loader = { path = "../adapter_loader", features = ["curve-builder", "fpml"] }
infra_config = { path = "../infra_config" }
infra_domain = { path = "../infra_domain" }

# CLI (optional, feature-gated)
clap = { workspace = true, optional = true }

# Python bindings (optional, feature-gated)
pyo3 = { workspace = true, optional = true }

# Validation
validator.workspace = true

# OpenAPI documentation
utoipa = { workspace = true, optional = true }

# Caching
lru = "0.12"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
tonic-build = "0.12"

[features]
default = ["rest"]
# Enable REST API (Axum)
rest = []
# Enable gRPC API (Tonic)
grpc = []
# Enable Risk Service (Greeks, Scenarios, Portfolio)
risk = []
# Enable Model Service (Stochastic models, pricing)
models = []
# Enable Volatility Service (Vol Surface, Cube)
volatility = []
# Enable Demo GUI integration
demo = []
# Enable CLI (clap-based command line interface)
cli = ["dep:clap"]
# Enable Python bindings (PyO3)
python = ["dep:pyo3"]
# OpenAPI documentation (Swagger UI)
openapi = ["dep:utoipa"]
# Full bundle with all services
full = ["rest", "risk", "models", "volatility", "demo", "cli", "openapi"]

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }

[lints]
workspace = true
