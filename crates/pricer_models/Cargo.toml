[package]
name = "pricer_models"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Financial instrument definitions and stochastic models for neutryx-rust"

[features]
default = ["equity", "serde"]

# Asset class features
equity = []
rates = []
credit = []
fx = []
commodity = []
exotic = ["equity"]  # Exotic products typically extend equity derivatives

# Convenience feature for all asset classes
all = ["equity", "rates", "credit", "fx", "commodity", "exotic"]

# Serialisation support
serde = ["dep:serde", "dep:serde_json", "pricer_core/serde", "infra_domain/serde"]

# Parallel processing for multi-curve bootstrapping
parallel = ["dep:rayon"]

# Global bootstrapping with multi-dimensional Newton solver
global-bootstrap = ["pricer_core/linalg"]

# Sparse matrix support for large-scale calibration problems
sparse = ["global-bootstrap", "pricer_core/sparse"]

# VolCube calibration (planned feature, not yet implemented)
volcube = []

# Advanced volatility model features
local-vol = []
stochastic-local-vol = ["local-vol"]
advanced-vol-models = ["local-vol", "stochastic-local-vol"]

# Automatic differentiation (Enzyme AD)
# Requires nightly Rust toolchain with Enzyme support.
# Enables AD-based Jacobian computation with automatic fallback to finite differences.
# Feature gates: compute_jacobian_with_stability_check, compute_jacobian_enzyme_with_fallback
enzyme-ad = ["global-bootstrap"]

# Debug logging for internal diagnostics (development only)
debug-logging = []

# Tracing support for diagnostic logging
tracing = []

[dependencies]
pricer_core = { path = "../pricer_core" }
infra_domain = { path = "../infra_domain" }
enum_dispatch.workspace = true
num-traits.workspace = true
chrono.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
rayon = { workspace = true, optional = true }
lru.workspace = true
dashmap.workspace = true
ordered-float.workspace = true
parking_lot.workspace = true

[dev-dependencies]
approx.workspace = true
proptest.workspace = true
criterion = { workspace = true, features = ["html_reports"] }
serde_json.workspace = true
rstest.workspace = true

[[bench]]
name = "models"
harness = false

[[bench]]
name = "volcube"
harness = false
required-features = ["volcube"]

[[bench]]
name = "instrument_compile"
harness = false
required-features = ["global-bootstrap"]

[[bench]]
name = "numerical_stability"
harness = false
required-features = ["global-bootstrap"]

[lints]
workspace = true
