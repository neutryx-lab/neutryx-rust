[package]
name = "pricer_models"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Financial instrument definitions and stochastic models for neutryx-rust"

[features]
default = []

# Automatic differentiation (Enzyme AD)
# Requires nightly Rust toolchain with Enzyme support.
enzyme-ad = []

# Debug logging for internal diagnostics (development only)
debug-logging = []

[dependencies]
pricer_core = { path = "../pricer_core" }
infra_domain = { path = "../infra_domain" }
enum_dispatch.workspace = true
num-traits.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rayon.workspace = true
lru.workspace = true
dashmap.workspace = true
ordered-float.workspace = true
parking_lot.workspace = true
strum.workspace = true
tracing.workspace = true

[dev-dependencies]
approx.workspace = true
proptest.workspace = true
criterion = { workspace = true, features = ["html_reports"] }
serde_json.workspace = true
rstest.workspace = true

[[bench]]
name = "models"
harness = false

[lints]
workspace = true
