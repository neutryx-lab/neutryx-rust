[package]
name = "pricer_core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
num-traits.workspace = true
chrono = { workspace = true, features = [] }
thiserror.workspace = true
serde = { workspace = true, features = ["derive"], optional = true }
infra_master = { path = "../infra_master" }
rayon = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
nalgebra = { workspace = true, optional = true }
nalgebra-sparse = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
rand_distr = { workspace = true, optional = true }

# External numerics (optional, for external-numerics feature)
argmin = { workspace = true, optional = true }
argmin-math = { workspace = true, optional = true }
levenberg-marquardt = { workspace = true, optional = true }

[dev-dependencies]
approx.workspace = true
proptest.workspace = true
criterion = { workspace = true, features = ["html_reports"] }
serde_json = "1.0"

[[bench]]
name = "core"
harness = false

[features]
default = ["serde", "equity", "parallel", "external-numerics", "rng"]
enzyme-mode = []                   # Production mode (Enzyme AD)
execution-trace = []               # Execution trace mode for computation graph extraction
serde = ["dep:serde", "chrono/serde", "infra_master/serde"]  # Serialisation support
parallel = ["dep:rayon"]           # Parallel bootstrapping support
rng = ["dep:rand", "dep:rand_distr"]  # Random number generation (PRNG, QMC placeholders)
linalg = ["dep:ndarray", "dep:nalgebra", "rng"]  # Linear algebra support (includes multi-dimensional copula)
sparse = ["linalg", "dep:nalgebra-sparse"]  # Sparse matrix support (CSR/CSC, SparseLU)
external-numerics = ["dep:argmin", "dep:argmin-math", "dep:levenberg-marquardt", "dep:nalgebra"]  # External optimisation libraries

# Asset class features (trades/instruments)
equity = []      # Equity derivatives (VanillaOption, Forward) - default
rates = []       # Interest rate derivatives (IRS, Swaption, Cap/Floor)
credit = []      # Credit derivatives (CDS)
fx = []          # FX derivatives (FxOption, FxForward)
commodity = []   # Commodity derivatives
exotic = ["equity"]  # Exotic products (typically extend equity)

# Convenience feature for all asset classes
all = ["equity", "rates", "credit", "fx", "commodity", "exotic"]

[lints]
workspace = true
