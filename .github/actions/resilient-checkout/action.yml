name: 'Resilient Checkout'
description: 'Checkout with extended retry logic for transient GitHub server errors (5xx)'

inputs:
  fetch-depth:
    description: 'Number of commits to fetch. 0 indicates all history for all branches and tags.'
    default: '1'
  ref:
    description: 'The branch, tag or SHA to checkout.'
    default: ''

runs:
  using: 'composite'
  steps:
    # Attempt 1 — actions/checkout@v4 has ~3 internal retries (~45s)
    - name: 'Checkout (attempt 1)'
      id: checkout-1
      uses: actions/checkout@v4
      continue-on-error: true
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        ref: ${{ inputs.ref }}

    # Attempt 2 — wait 30s then retry
    - name: 'Wait before retry (30s)'
      if: steps.checkout-1.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::Checkout attempt 1 failed. Retrying in 30s..."
        sleep 30

    - name: 'Checkout (attempt 2)'
      id: checkout-2
      if: steps.checkout-1.outcome == 'failure'
      uses: actions/checkout@v4
      continue-on-error: true
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        ref: ${{ inputs.ref }}

    # Attempt 3 — wait 60s then retry (final, will hard-fail on error)
    - name: 'Wait before retry (60s)'
      if: steps.checkout-1.outcome == 'failure' && steps.checkout-2.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::Checkout attempt 2 failed. Retrying in 60s..."
        sleep 60

    - name: 'Checkout (attempt 3 — final)'
      if: steps.checkout-1.outcome == 'failure' && steps.checkout-2.outcome == 'failure'
      uses: actions/checkout@v4
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        ref: ${{ inputs.ref }}
