name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: ""

jobs:
  stable:
    name: Stable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude pricer_pricing --exclude pricer_risk -- -D warnings
      - run: cargo test --workspace --exclude pricer_pricing --exclude pricer_risk

  nightly:
    name: Nightly (L3/L4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, llvm-tools, rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Install Enzyme (optional)
        id: enzyme
        run: |
          if rustup +nightly component add rustc-codegen-llvm-enzyme 2>/dev/null; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi
      - name: Build & test pricer_pricing
        run: |
          if [ "${{ steps.enzyme.outputs.available }}" == "true" ]; then
            export RUSTFLAGS="-Z autodiff=Enable"
          fi
          cargo +nightly build -p pricer_pricing
          cargo +nightly test -p pricer_pricing
          cargo +nightly clippy -p pricer_pricing -- -D warnings
      - name: Build & test pricer_risk
        run: |
          cargo +nightly build -p pricer_risk
          cargo +nightly test -p pricer_risk
          cargo +nightly clippy -p pricer_risk -- -D warnings

  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: [stable, nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools, rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly test --workspace

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --exclude pricer_pricing --exclude pricer_risk --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: [stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p pricer_models --bench models -- --noplot
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: target/criterion/
          retention-days: 30

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --exclude pricer_pricing --exclude pricer_risk --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
