name: AI Auto-Remediation

# Trigger on CI failure
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# Limit to one concurrent run per branch
concurrency:
  group: ai-fixer-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  diagnose-and-fix:
    name: AI Diagnose & Fix
    # Only run on failure, and skip for main/develop to avoid noise
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch != 'main' &&
      github.event.workflow_run.head_branch != 'develop'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      actions: read

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
        continue-on-error: true

      - name: Retry checkout on failure
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Checkout failed (GitHub 5xx). Retrying in 60s..."
          sleep 60

      - name: Checkout repository (retry)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements-ai.txt

      - name: Fetch CI failure logs
        id: fetch-logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching logs for workflow run ${{ github.event.workflow_run.id }}"

          # Get failed job logs
          gh run view ${{ github.event.workflow_run.id }} --log-failed > failed_log.txt 2>&1 || true

          # Check if we got any content
          if [ ! -s failed_log.txt ]; then
            echo "No failed logs found, attempting full log download"
            gh run view ${{ github.event.workflow_run.id }} --log > failed_log.txt 2>&1 || true
          fi

          # Verify we have something to analyse
          if [ -s failed_log.txt ]; then
            echo "has_logs=true" >> $GITHUB_OUTPUT
            echo "Log file size: $(wc -c < failed_log.txt) bytes"
            echo "First 50 lines of log:"
            head -50 failed_log.txt
          else
            echo "has_logs=false" >> $GITHUB_OUTPUT
            echo "Warning: No logs available"
          fi

      - name: Analyse failures
        id: analyse
        if: steps.fetch-logs.outputs.has_logs == 'true'
        run: |
          echo "Analysing CI failures..."
          python -m ai_fixer --log failed_log.txt --dry-run --verbose > analysis.txt 2>&1 || true

          # Check for fixable failures
          if grep -q "COMPILATION\|CLIPPY\|TEST\|FORMAT" analysis.txt; then
            echo "fixable=true" >> $GITHUB_OUTPUT
          else
            echo "fixable=false" >> $GITHUB_OUTPUT
          fi

          cat analysis.txt
        working-directory: scripts

      - name: Generate AI fix
        id: generate-fix
        if: steps.analyse.outputs.fixable == 'true'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          echo "Generating AI fix..."

          # Generate fix with JSON output
          python -m ai_fixer \
            --log ../failed_log.txt \
            --output ../fix.patch \
            --json \
            --verbose > fix_result.json 2>&1 || true

          # Check if patch was generated
          if [ -s ../fix.patch ]; then
            echo "patch_generated=true" >> $GITHUB_OUTPUT
            echo "Patch generated successfully"

            # Extract confidence from JSON output
            CONFIDENCE=$(grep -o '"confidence": [0-9.]*' fix_result.json | head -1 | grep -o '[0-9.]*' || echo "0.5")
            echo "confidence=$CONFIDENCE" >> $GITHUB_OUTPUT
          else
            echo "patch_generated=false" >> $GITHUB_OUTPUT
            echo "No patch generated"
            cat fix_result.json || true
          fi
        working-directory: scripts

      - name: Validate patch
        id: validate
        if: steps.generate-fix.outputs.patch_generated == 'true'
        run: |
          echo "Validating patch..."

          # Check if patch applies cleanly
          if git apply --check fix.patch 2>/dev/null; then
            echo "patch_valid=true" >> $GITHUB_OUTPUT
            echo "Patch is valid and can be applied"
          else
            echo "patch_valid=false" >> $GITHUB_OUTPUT
            echo "Patch validation failed"
            git apply --check fix.patch 2>&1 || true
          fi

      - name: Create fix branch and PR
        if: steps.validate.outputs.patch_valid == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Generate branch name
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BASE_BRANCH="${{ github.event.workflow_run.head_branch }}"
          FIX_BRANCH="ai-fix/${BASE_BRANCH}-${TIMESTAMP}"

          echo "Creating fix branch: $FIX_BRANCH"

          # Create and checkout fix branch
          git checkout -b "$FIX_BRANCH"

          # Apply patch
          git apply fix.patch

          # Stage and commit
          git add -A
          git commit -m "fix: AI-generated fix for CI failure

          Auto-generated fix for failed CI run.
          Original branch: ${BASE_BRANCH}
          Confidence: ${{ steps.generate-fix.outputs.confidence }}

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

          # Push branch
          git push -u origin "$FIX_BRANCH"

          # Create draft PR
          PR_BODY=$(cat <<'EOF'
          ## AI-Generated Fix

          This PR contains an automatically generated fix for the CI failure in branch `${{ github.event.workflow_run.head_branch }}`.

          ### Details
          - **Failed Workflow Run**: [${{ github.event.workflow_run.id }}](${{ github.event.workflow_run.html_url }})
          - **Confidence Score**: ${{ steps.generate-fix.outputs.confidence }}
          - **Generated by**: Gemini API

          ### Review Checklist
          - [ ] Verify the fix addresses the root cause
          - [ ] Check for unintended side effects
          - [ ] Ensure code follows project conventions
          - [ ] Run tests locally before merging

          ---
          *This fix was generated by AI and requires human review before merging.*
          EOF
          )

          gh pr create \
            --draft \
            --title "[AI Fix] Resolve CI failure in ${BASE_BRANCH}" \
            --body "$PR_BODY" \
            --base "${BASE_BRANCH}"

      - name: Post comment on failed run (no fix possible)
        if: |
          steps.fetch-logs.outputs.has_logs == 'true' &&
          (steps.analyse.outputs.fixable != 'true' || steps.generate-fix.outputs.patch_generated != 'true' || steps.validate.outputs.patch_valid != 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "AI Fixer could not generate a valid fix for this failure."
          echo "Possible reasons:"
          echo "- Failure type not supported"
          echo "- Generated patch could not be applied"
          echo "- Confidence score too low"

          # Try to find associated PR and comment
          PR_NUMBER=$(gh pr list --head "${{ github.event.workflow_run.head_branch }}" --json number --jq '.[0].number' || true)

          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            COMMENT_BODY=$(cat <<'EOF'
          ### AI Fixer Analysis

          The AI Fixer analysed the CI failure but could not generate a valid fix.

          **Failure Analysis:**
          ```
          $(cat scripts/analysis.txt 2>/dev/null || echo "Analysis not available")
          ```

          **Possible reasons:**
          - The failure type may not be automatically fixable
          - The generated patch could not be applied cleanly
          - Manual intervention may be required

          Please review the [failed workflow run](${{ github.event.workflow_run.html_url }}) for details.
          EOF
          )

            gh pr comment "$PR_NUMBER" --body "$COMMENT_BODY" || true
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-fixer-artifacts
          path: |
            failed_log.txt
            fix.patch
            scripts/analysis.txt
            scripts/fix_result.json
          retention-days: 7
          if-no-files-found: ignore
