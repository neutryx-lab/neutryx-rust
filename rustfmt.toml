# rustfmt.toml - Neutryx Code Style Configuration
edition = "2021"
max_width = 100
use_field_init_shorthand = true
use_try_shorthand = true

# Imports organisation (grouped for C++ developers' readability)
group_imports = "StdExternalCrate"
imports_granularity = "Crate"

# Comment formatting (accommodate mathematical notation)
wrap_comments = true
normalize_comments = true
normalize_doc_attributes = true

# Allow short functions on a single line
fn_single_line = true
