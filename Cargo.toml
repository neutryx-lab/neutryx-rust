[workspace]
members = [
    # --- A: Adapter Layer (Input) ---
    "crates/adapter_loader",

    # --- I: Infra Layer (Foundation) ---
    "crates/infra_config",
    "crates/infra_domain",

    # --- P: Pricer Layer (The Kernel) ---
    "crates/pricer_core",
    "crates/pricer_models",
    "crates/pricer_pricing",
    "crates/pricer_risk",

    # --- S: Service Layer (Output) ---
    "crates/service_gateway",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/neutryx-lab/neutryx-rust"
authors = ["Neutryx Lab"]

[workspace.dependencies]
# Core numeric types
num-traits = "0.2"

# Linear algebra
nalgebra = "0.33"
nalgebra-sparse = "0.10"

# Random number generation
rand = "0.8"
rand_distr = "0.4"

# Parallelisation
rayon = "1.10"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Serialisation
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Configuration
config = "0.14"

# Async runtime
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.4", features = ["derive"] }

# Web frameworks
axum = { version = "0.7", features = ["json", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tonic = "0.12"
prost = "0.13"

# Python bindings
pyo3 = { version = "0.22", features = ["extension-module"] }

# XML parsing
quick-xml = "0.37"

# File formats
csv = "1.3"
parquet = { version = "54.0", default-features = false }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }

# Optimisation
argmin = "0.10"
argmin-math = { version = "0.4", features = ["nalgebra_latest"] }
levenberg-marquardt = "0.14"

# Testing
approx = "0.5"
proptest = "1.6"
criterion = "0.5"
rstest = "0.23"

# System
num_cpus = "1.16"

# Caching
lru = "0.12"
dashmap = "6.0"
ordered-float = "4.0"
parking_lot = "0.12"

# Enum utilities
strum = { version = "0.26", features = ["derive"] }
strum_macros = "0.26"

# Builder pattern
bon = "3.8"

# Enum dispatch for static trait forwarding
enum_dispatch = "0.3"

# Validation
validator = { version = "0.20", features = ["derive"] }

# OpenAPI documentation
utoipa = { version = "5", features = ["axum_extras"] }

# Graph data structures and algorithms
petgraph = "0.6"

# Newtype derive utilities
derive_more = { version = "2", features = ["from", "display", "as_ref", "add", "mul"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = "symbols"

[profile.bench]
inherits = "release"

# Profile for PGO instrumented builds (cargo-pgo)
# Usage: cargo +nightly pgo build
[profile.pgo-generate]
inherits = "release"

# Profile for PGO optimized builds (cargo-pgo)
# Usage: cargo +nightly pgo optimize
[profile.pgo-use]
inherits = "release"

# Development profile optimisation
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Test profile optimisation
[profile.test]
opt-level = 1

# =============================================================================
# Workspace-wide Lint Configuration
# =============================================================================
[workspace.lints.rust]
# Require documentation for public items
missing_docs = "warn"
# Prohibit unsafe code by default (use #[allow(unsafe_code)] where necessary)
unsafe_code = "deny"

[workspace.lints.clippy]
# Enable pedantic checks for production-quality code
pedantic = { level = "warn", priority = -1 }
# Allow panic-related lints (financial code uses controlled panics for invariants)
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
# Warn about direct floating-point equality comparisons
float_cmp = "warn"
# Warn about mathematically inefficient operations
suboptimal_flops = "allow"  # Micro-optimisation suggestions not always practical
# Ensure documentation follows markdown conventions
doc_markdown = "warn"

# Allow common pedantic lints that are too strict for this codebase
redundant_closure_for_method_calls = "allow"
return_self_not_must_use = "allow"
map_unwrap_or = "allow"
cast_possible_wrap = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
too_many_arguments = "allow"
double_must_use = "allow"
match_wildcard_for_single_variants = "allow"
module_inception = "allow"
useless_conversion = "allow"
similar_names = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
items_after_statements = "allow"
struct_excessive_bools = "allow"
manual_let_else = "allow"
too_many_lines = "allow"
unused_self = "allow"
manual_range_contains = "allow"
needless_range_loop = "allow"
cast_precision_loss = "allow"
unreadable_literal = "allow"
enum_glob_use = "allow"
wildcard_imports = "allow"
option_if_let_else = "allow"
match_same_arms = "allow"
if_not_else = "allow"
uninlined_format_args = "allow"
excessive_precision = "allow"
assign_op_pattern = "allow"
many_single_char_names = "allow"
default_trait_access = "allow"
doc_link_with_quotes = "allow"
implicit_hasher = "allow"
range_plus_one = "allow"
trivially_copy_pass_by_ref = "allow"
single_match_else = "allow"
manual_map = "allow"
unnested_or_patterns = "allow"
match_bool = "allow"
missing_const_for_fn = "allow"
redundant_else = "allow"
use_self = "allow"
inconsistent_digit_grouping = "allow"
type_complexity = "allow"
explicit_iter_loop = "allow"
into_iter_without_iter = "allow"
cast_lossless = "allow"
