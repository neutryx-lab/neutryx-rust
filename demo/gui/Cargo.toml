[package]
name = "demo_gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Web dashboard for FrictionalBank demo"

[[bin]]
name = "demo-web"
path = "src/web/main.rs"

[features]
default = []
enzyme-ad = ["pricer_pricing/enzyme-ad"]
openapi = ["utoipa", "utoipa-swagger-ui"]

[dependencies]
# Pricer layer
pricer_core = { path = "../../crates/pricer_core" }
pricer_models = { path = "../../crates/pricer_models" }
pricer_pricing = { path = "../../crates/pricer_pricing" }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# UUID for curve cache
uuid = { version = "1.0", features = ["v4"] }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Web server
axum = { workspace = true, features = ["ws"] }
tower-http = { workspace = true, features = ["fs", "set-header"] }
futures = "0.3"
chrono = { workspace = true }
open = "5"

# OpenAPI documentation (optional)
utoipa = { version = "4", features = ["axum_extras"], optional = true }
utoipa-swagger-ui = { version = "7", features = ["axum"], optional = true }

# Validation
validator = { version = "0.19", features = ["derive"] }

[dev-dependencies]
tokio-test = "0.4"

[lints]
workspace = true
