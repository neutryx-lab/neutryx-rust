[package]
name = "demo_gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Web dashboard for FrictionalBank demo"

[[bin]]
name = "demo-web"
path = "src/web/main.rs"

[features]
# L1/L2 integration is default because pricer_risk (in workspace) requires it
# This disables the standalone GenericPricer handlers
default = ["l1l2-integration", "calibration", "global-bootstrap"]
enzyme-ad = ["pricer_risk/enzyme-ad"]
openapi = ["utoipa", "utoipa-swagger-ui"]
# L1/L2 integration feature - disables standalone pricer mode
l1l2-integration = ["pricer_pricing/l1l2-integration"]
# Advanced calibration features (curve bootstrap engine, FX vol surface)
# These handlers depend on pricer_models calibration module which is not yet implemented
calibration = []
# Global bootstrapping with jump calibration support (CB Meeting dates)
global-bootstrap = ["pricer_models/global-bootstrap"]

[dependencies]
# Infra layer
infra_master = { path = "../../crates/infra_master", features = ["serde"] }

# Adapter layer
adapter_loader = { path = "../../crates/adapter_loader", features = ["curve-builder"] }

# Pricer layer
pricer_core = { path = "../../crates/pricer_core", features = ["execution-trace", "serde"] }
pricer_models = { path = "../../crates/pricer_models" }
pricer_pricing = { path = "../../crates/pricer_pricing" }
pricer_risk = { path = "../../crates/pricer_risk", features = ["serde"] }

# Config layer
infra_config = { path = "../../crates/infra_config", features = ["serde"] }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Numeric traits
num-traits = { workspace = true }

# UUID for curve cache
uuid = { version = "1.0", features = ["v4"] }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Web server
axum = { workspace = true, features = ["ws"] }
tower-http = { workspace = true, features = ["fs", "set-header"] }
futures = "0.3"
chrono = { workspace = true }
open = "5"

# OpenAPI documentation (optional)
utoipa = { version = "4", features = ["axum_extras"], optional = true }
utoipa-swagger-ui = { version = "7", features = ["axum"], optional = true }

# Validation
validator = { version = "0.19", features = ["derive"] }

[dev-dependencies]
tokio-test = "0.4"
approx = "0.5"

[lints]
workspace = true
